services:
  # Dev: Vite HMR. Продакшен-статика — сервис frontend-nginx (profile prod).
  frontend-dev:
    image: node:22-alpine
    container_name: etp-frontend-dev
    working_dir: /app
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_HTTP_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: ${API_UPSTREAM:-http://host.docker.internal:8200}
      VITE_DEV_PORT: "5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["dev"]

  # Prod-like: nginx раздаёт dist + проксирует /api и /sanctum на бэк
  frontend-nginx:
    image: nginx:1.27-alpine
    container_name: etp-frontend-nginx
    ports:
      - "${FRONTEND_HTTP_PORT:-5173}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["prod"]

volumes:
  frontend_node_modules:
